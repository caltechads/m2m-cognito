[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "m2m-cognito"
version = "0.1.4"
description = "Machine-to-machine AWS Cognito OAuth2 client credentials and access token validation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Caltech IMSS ADS", email = "imss-ads-staff@caltech.edu"}
]
license = {file = "LICENSE.txt"}
keywords = ["aws", "cognito", "oauth2", "client credentials", "access token validation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]

dependencies = [
    "dotenv>=0.9.9",
    "pyjwt[crypto]>=2.12.1",
    "requests>=2.33.1",
]

[project.urls]
Homepage = "https://github.com/caltechads/m2m-cognito"

[tool.hatch.build.targets.wheel]
packages = ["m2m_cognito"]

[tool.bumpversion]
current_version = "0.1.4"
tag = true
tag_name = "v{new_version}"
commit = true
message = "Bump version: {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "m2m_cognito/__init__.py"

